<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#F6F8FC"><meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Overload"><meta name="mobile-web-app-capable" content="yes">
  <meta name="description" content="Your private, on-device training and routine tracker.">
  <link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
  <link rel="stylesheet" href="styles.css?v=2-5"><title>Overload — Make it count.</title>
</head>
<body>
  <div class="app" id="app">
    <header class="topbar"><a class="wordmark" href="#today" aria-label="Overload home"><span class="mark">O<span>·</span></span><span>OVERLOAD</span></a><div class="topright"><span class="private"><span class="private-dot"></span>ON THIS DEVICE</span><button id="themeButton" class="icon-btn" aria-label="Toggle theme" title="Switch appearance">◐</button></div></header>
    <main id="screen" tabindex="-1"></main>
    <nav class="bottomnav" aria-label="Main navigation">
      <button class="navitem active" data-nav="today"><span class="navicon">◉</span><span>Today</span></button>
      <button class="navitem" data-nav="training"><span class="navicon">▣</span><span>Training</span></button>
      <button class="navitem" data-nav="week"><span class="navicon">▥</span><span>Progress</span></button>
      <button class="navitem" data-nav="settings"><span class="navicon">☷</span><span>Settings</span></button>
    </nav>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div class="copy-fallback" id="copyFallback" hidden><div class="copy-card"><h2>Copy weekly report</h2><p>Select all text and tap Copy, then paste into your AI chat.</p><textarea id="copyFallbackText" readonly aria-label="Weekly report"></textarea><button type="button" id="closeCopyFallback" onclick="document.getElementById('copyFallback').hidden=true">Close</button></div></div>
  <input type="file" id="planPicker" hidden accept="application/json,.json">
  <input type="file" id="backupPicker" hidden accept="application/json,.json">
  <input type="file" id="workoutTextPicker" hidden accept="text/plain,.txt">
  <script src="app.js?v=2-5" defer></script>
</body>
</html>
