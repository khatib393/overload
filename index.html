<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Overload">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>Overload Log</title>
<style>
/* Apple-style glass: iOS system colours, SF Pro (Rounded for numbers),
   frosted panels over a soft colour field, floating tab bar. Follows the phone's light/dark mode. */
:root{
  --bg:#F2F2F7;
  --glass:rgba(255,255,255,.62); --glass-brd:rgba(255,255,255,.8); --glass-hi:rgba(255,255,255,.75);
  --shadow:0 8px 28px rgba(31,38,80,.08);
  --label:#000; --label2:rgba(60,60,67,.62); --label3:rgba(60,60,67,.32);
  --sep:rgba(60,60,67,.16); --fill:rgba(118,118,128,.12); --fill2:rgba(118,118,128,.2);
  --seg-on:#FFFFFF; --seg-sh:0 3px 8px rgba(0,0,0,.12),0 1px 1px rgba(0,0,0,.04);
  --blue:#007AFF; --green:#34C759; --orange:#FF9500; --red:#FF3B30;
  --b1:rgba(0,122,255,.30); --b2:rgba(52,199,89,.22); --b3:rgba(255,149,0,.20); --b4:rgba(175,82,222,.20);
  --accent:var(--blue);
  --round:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --body:-apple-system,system-ui,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --blur:saturate(180%) blur(28px);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000;
    --glass:rgba(36,36,40,.56); --glass-brd:rgba(255,255,255,.1); --glass-hi:rgba(255,255,255,.08);
    --shadow:0 8px 28px rgba(0,0,0,.45);
    --label:#FFF; --label2:rgba(235,235,245,.62); --label3:rgba(235,235,245,.3);
    --sep:rgba(84,84,88,.55); --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.36);
    --seg-on:#636366; --seg-sh:0 3px 8px rgba(0,0,0,.3);
    --blue:#0A84FF; --green:#30D158; --orange:#FF9F0A; --red:#FF453A;
    --b1:rgba(10,132,255,.38); --b2:rgba(48,209,88,.22); --b3:rgba(255,159,10,.2); --b4:rgba(191,90,242,.26);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000;
  --glass:rgba(36,36,40,.56); --glass-brd:rgba(255,255,255,.1); --glass-hi:rgba(255,255,255,.08);
  --shadow:0 8px 28px rgba(0,0,0,.45);
  --label:#FFF; --label2:rgba(235,235,245,.62); --label3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.55); --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.36);
  --seg-on:#636366; --seg-sh:0 3px 8px rgba(0,0,0,.3);
  --blue:#0A84FF; --green:#30D158; --orange:#FF9F0A; --red:#FF453A;
  --b1:rgba(10,132,255,.38); --b2:rgba(48,209,88,.22); --b3:rgba(255,159,10,.2); --b4:rgba(191,90,242,.26);
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:transparent;color:var(--label);font:400 17px/1.35 var(--body);-webkit-font-smoothing:antialiased}
/* the colour field the glass sits on */
body::before{content:"";position:fixed;inset:-10%;z-index:-1;pointer-events:none;
  background:
    radial-gradient(40% 32% at 12% 6%,var(--b1),transparent 70%),
    radial-gradient(38% 30% at 92% 22%,var(--b4),transparent 70%),
    radial-gradient(45% 34% at 80% 78%,var(--b2),transparent 70%),
    radial-gradient(40% 30% at 8% 92%,var(--b3),transparent 70%),
    var(--bg)}
main{max-width:560px;margin:0 auto;padding:10px 16px 124px}
h1,h2,h3{margin:0;font-family:var(--body)}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:active{opacity:.6}
input,textarea{font:inherit;color:inherit}
::placeholder{color:var(--label3)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* glass surfaces */
.ex,.prog,.hsess,.days,.seg,.banner,.pending,nav.tabs{
  background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  border:.5px solid var(--glass-brd);box-shadow:inset 0 1px 0 var(--glass-hi),var(--shadow)}

/* segmented controls */
.days,.seg{display:grid;gap:2px;padding:3px;border-radius:12px}
.days{grid-template-columns:repeat(7,1fr);margin-top:6px}
.seg{grid-template-columns:repeat(4,1fr);margin-top:14px}
.days button,.seg button{position:relative;height:36px;border:0;border-radius:9px;background:transparent;color:var(--label);font:600 15px var(--body)}
.days button[aria-pressed="true"],.seg button[aria-pressed="true"]{background:var(--seg-on);box-shadow:var(--seg-sh)}
.days button.is-today:not([aria-pressed="true"]){color:var(--blue)}
.days button.is-today::after{content:"";position:absolute;left:50%;bottom:3px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--blue)}

/* large title */
.dayhead{margin:22px 4px 8px}
.dayhead h1{font-weight:700;font-size:34px;line-height:1.1;letter-spacing:.2px}
.dateline{display:flex;align-items:center;gap:12px;margin-top:8px;flex-wrap:wrap}
.dateline input{height:36px;padding:0 12px;border:0;border-radius:10px;background:var(--fill);font-size:16px}

/* cards */
.ex,.prog{position:relative;margin:14px 0;padding:16px;border-radius:24px}
.ex{--st:var(--orange)}
.ex.st-new{--st:var(--label2)}
.ex.st-going{--st:var(--blue)}
.ex.st-done{--st:var(--green)}
.ex-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ex-name{font-weight:600;font-size:20px;line-height:1.2;overflow-wrap:anywhere}
.ex-name::before{content:"";display:inline-block;width:9px;height:9px;margin:0 8px 2px 0;border-radius:50%;background:var(--st);vertical-align:middle}
.range{flex:none;min-height:30px;padding:4px 11px;border:0;border-radius:999px;background:var(--fill);color:var(--label2);font:500 13px var(--body)}
.last{margin-top:6px;color:var(--label2);font-size:15px}
.last b{color:var(--label);font-weight:500}
.last .s{margin-right:10px;white-space:nowrap;color:var(--label);font-family:var(--round);font-variant-numeric:tabular-nums}
.last .s.w{color:var(--label2)}

/* the readout: big rounded numerals in the status colour, like Fitness */
.beat{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 10px;margin-top:10px}
.beat .lbl{font:600 15px var(--body);color:var(--label2)}
.beat .num{font:700 36px/1.08 var(--round);letter-spacing:-.2px;word-spacing:4px;white-space:nowrap;color:var(--st,var(--label));font-variant-numeric:tabular-nums}
.beat.up .num{color:var(--green)}
.beat .num small{margin:0 6px 0 3px;font:600 19px var(--round);word-spacing:0;color:var(--label2)}
.note{margin-top:5px;font-size:13px;line-height:1.38;color:var(--label2)}
.note.gain{color:var(--green);font-weight:500}
.note.warn{color:var(--red);font-weight:500}

/* logged sets, quick picks */
.sets{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{display:inline-flex;align-items:center;height:36px;padding-left:12px;border-radius:12px;background:var(--fill);font:600 17px var(--round);font-variant-numeric:tabular-nums}
.chip small{margin-left:6px;font:500 14px var(--body);color:var(--label2)}
.chip button{width:32px;height:34px;border:0;background:none;color:var(--label3);font-size:18px;line-height:1}
.chip.wu{background:transparent;border:1px solid var(--sep);color:var(--label2)}
.chip.drop{color:var(--label2)}
.wu-row,.qrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:12px}
.wu-row .lbl,.qrow .lbl{margin-right:2px;font:500 13px var(--body);color:var(--label2)}
.wuchip,.qchip{min-height:34px;padding:4px 12px;border:0;border-radius:999px;background:color-mix(in srgb,var(--blue) 14%,transparent);color:var(--blue);font:600 15px var(--body);text-align:left}
.wuchip{font-family:var(--round)}
.qchip small{margin-left:6px;font-weight:400;opacity:.8}

/* entry */
.entry{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.entry .full{grid-column:1/-1}
.step{display:grid;grid-template-columns:46px minmax(0,1fr) 46px;height:52px;border-radius:14px;background:var(--fill);overflow:hidden}
.step button{border:0;background:transparent;color:var(--blue);font-size:26px;font-weight:400;line-height:1}
.step input{width:100%;min-width:0;border:0;background:transparent;text-align:center;font:700 24px var(--round);font-variant-numeric:tabular-nums}
.step-lbl{margin-top:4px;text-align:center;font-size:12px;color:var(--label2)}
.logbtn{grid-column:1/-1;height:52px;border:0;border-radius:999px;background:var(--blue);color:#fff;font:600 17px var(--body)}
.link{padding:10px 0;border:0;background:none;color:var(--blue);font-size:15px;font-weight:400}
.typed{display:grid;grid-template-columns:1fr auto;gap:8px}
.hint{margin-top:6px;font-size:12px;color:var(--label2)}

.settings{display:grid;gap:10px;margin-top:14px;padding-top:14px;border-top:.5px solid var(--sep)}
.settings label{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-size:15px}
.settings .num{width:66px;text-align:center}
.settings .grow{flex:1;min-width:160px}

.field{width:100%;height:44px;padding:0 14px;border:0;border-radius:12px;background:var(--fill);font-size:17px}
.field.num{width:74px;text-align:center;font-family:var(--round)}
.field.area{display:block;height:auto;min-height:240px;margin-top:12px;padding:12px 14px;font:400 15px/1.45 var(--body);resize:vertical}
.field.area.small{min-height:130px}
.btn{height:44px;padding:0 18px;border:0;border-radius:999px;background:var(--fill);color:var(--blue);font:600 16px var(--body);white-space:nowrap}
.btn.primary{background:var(--blue);color:#fff}
.btn.danger{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.filebtn{display:inline-flex;align-items:center;cursor:pointer}

.empty{margin:18px 0;padding:18px;border-radius:20px;background:var(--fill);color:var(--label2);font-size:15px}
.add{margin:24px 4px 8px}
.add label{display:block;margin-bottom:8px;font:600 17px var(--body)}
.addrow{display:grid;grid-template-columns:1fr auto;gap:8px}
.pending{margin-top:10px;padding:12px 14px;border-radius:16px;font-size:15px}

.session{margin:28px 4px 0;padding-top:16px;border-top:.5px solid var(--sep)}
.session h2,section h2{margin-bottom:6px;font-weight:600;font-size:20px}
.totals{display:flex;flex-wrap:wrap;gap:4px 20px;margin-bottom:10px;font:500 15px var(--body);color:var(--label2)}
.totals b{margin-right:5px;font:700 28px var(--round);color:var(--label);font-variant-numeric:tabular-nums}
.fallback{margin-top:10px}

section{margin-top:26px}
.sched{display:grid;gap:8px}
.schedrow{display:grid;grid-template-columns:52px 1fr;align-items:center;font:600 16px var(--body)}
.defs{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.defs label{display:flex;align-items:center;gap:8px}

.banner{display:block;width:100%;margin:4px 0 12px;padding:12px 14px;border-radius:16px;text-align:left;font-size:15px;color:var(--label)}
.banner.warn{color:var(--red);font-weight:500}

/* history, trend */
.hsess{margin-top:12px;padding:12px 16px;border-radius:22px}
.hhead{display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 10px}
.hhead h2{margin:0;font-weight:600;font-size:18px}
.hhead .focus{flex:1;color:var(--label2);font-size:15px}
.hhead .link{padding:6px 0}
.hrow{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:baseline;gap:0 10px;padding:8px 0;border-top:.5px solid var(--sep)}
.hhead + .hrow{border-top:0}
.hex{min-height:28px;padding:0;border:0;background:none;text-align:left;color:var(--blue);font:500 16px var(--body)}
.hsets{grid-column:1/-1;font:400 15px var(--round);font-variant-numeric:tabular-nums}
.hsets .w{margin-right:6px;color:var(--label2)}
.up{font:600 14px var(--body);color:var(--green);white-space:nowrap}
.htot{margin-top:6px;font-size:13px;color:var(--label2)}
.prog svg{display:block;width:100%;height:auto;margin:12px 0 6px}
.prow{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:.5px solid var(--sep);font-size:15px}
.prow span:last-child{text-align:right;font-family:var(--round);font-variant-numeric:tabular-nums}

/* food diary */
.flist{margin-top:10px}
.frow{display:grid;grid-template-columns:44px minmax(0,1fr) auto 32px;align-items:center;gap:6px;padding:8px 0;border-top:.5px solid var(--sep);font-size:15px}
.frow:first-child{border-top:0}
.frow .tm{font:500 14px var(--round);color:var(--label2);font-variant-numeric:tabular-nums}
.frow .nm{display:flex;align-items:center;gap:8px;overflow-wrap:anywhere}
.frow .nums{font:500 14px var(--round);color:var(--label2);white-space:nowrap;font-variant-numeric:tabular-nums}
.frow button{width:32px;height:32px;border:0;background:none;color:var(--label3);font-size:18px}
.thumb{flex:none;width:44px;height:44px;border-radius:10px;object-fit:cover;background:var(--fill)}
.photorow{display:flex;align-items:center;gap:10px}
.photorow .thumb{width:56px;height:56px;border-radius:12px}
.pixgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.pixgrid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px}
.bars{display:grid;gap:12px;margin-top:12px}
.bar-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:15px;color:var(--label2)}
.bar-top b{font:700 26px var(--round);color:var(--label);font-variant-numeric:tabular-nums}
.track{height:8px;margin-top:6px;border-radius:999px;background:var(--fill2);overflow:hidden}
.fill{height:100%;border-radius:999px;background:var(--blue)}
.fill.due{background:var(--orange)}
.fill.hit{background:var(--green)}
.fill.over{background:var(--red)}

/* floating glass tab bar */
nav.tabs{position:fixed;left:12px;right:12px;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:10;display:flex;max-width:536px;margin:0 auto;padding:5px;border-radius:30px}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:54px;border:0;border-radius:24px;background:none;color:var(--label);font:600 10.5px var(--body)}
nav.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{background:var(--fill);color:var(--blue)}

#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:20;max-width:calc(100% - 32px);padding:10px 16px;border-radius:999px;background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:.5px solid var(--glass-brd);box-shadow:var(--shadow);color:var(--label);font:500 15px var(--body);opacity:0;pointer-events:none;transform:translate(-50%,8px);transition:opacity .2s,transform .2s}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){#toast{transition:none}}
</style>
</head>
<body>
<main id="app" aria-live="off"></main>
<div id="toast" role="status" aria-live="polite"></div>
<nav class="tabs" aria-label="Sections">
  <button data-act="tab" data-view="today"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 7.5v9M17.5 7.5v9M3.5 10v4M20.5 10v4M6.5 12h11"/></svg><span>Today</span></button>
  <button data-act="tab" data-view="history"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg><span>History</span></button>
  <button data-act="tab" data-view="body"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4.5"/><path d="M8.5 10a5 5 0 0 1 7 0M12 10v2"/></svg><span>Body</span></button>
  <button data-act="tab" data-view="log"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3.5h6.5L18 8v12.5H7z"/><path d="M13.5 3.5V8H18M9.5 12.5h5.5M9.5 16h5.5"/></svg><span>Log</span></button>
  <button data-act="tab" data-view="setup"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg><span>Setup</span></button>
</nav>
<script>
(function(){
"use strict";
var KEY = "overload-log-v1";
var DAYS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
var MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

function blank(){
  return {
    v: 1,
    schedule: {Mon:"Chest + Triceps",Tue:"Back + Biceps",Wed:"Legs",Thu:"Shoulders + Abs",Fri:"Chest + Back",Sat:"Arms",Sun:"Rest"},
    plan: {Mon:[],Tue:[],Wed:[],Thu:[],Fri:[],Sat:[],Sun:[]},
    ex: {},
    log: {},
    body: {},
    food: {},
    diet: {kcal:2400, p:190},
    defaults: {lo:8, hi:12, inc:2.5},
    backupAt: null
  };
}

var S = blank();
var storageOK = true;

function load(){
  var raw = null;
  try { raw = localStorage.getItem(KEY); } catch(e){ storageOK = false; return; }
  if (raw){
    try {
      var d = JSON.parse(raw), b = blank();
      S = Object.assign(b, d);
      S.plan = Object.assign(blank().plan, d.plan || {});
      S.schedule = Object.assign(blank().schedule, d.schedule || {});
      S.defaults = Object.assign(blank().defaults, d.defaults || {});
      S.ex = d.ex || {}; S.log = d.log || {};
      S.body = d.body || {}; S.food = d.food || {};
      S.diet = Object.assign(blank().diet, d.diet || {});
      migrateBody(d);
    } catch(e){
      try { localStorage.setItem(KEY + ":unreadable-" + Date.now(), raw); } catch(_){}
    }
  }
  try { localStorage.setItem(KEY + ":probe","1"); localStorage.removeItem(KEY + ":probe"); }
  catch(e){ storageOK = false; }
}
// Earlier Body version stored meals[] plus per-day kcal/protein totals. Fold them into food entries.
function migrateBody(d){
  if (d.meals){
    Object.keys(d.meals).forEach(function(dt){
      (d.meals[dt] || []).forEach(function(m){
        if (!S.food[dt]) S.food[dt] = [];
        S.food[dt].push({n:cleanName(m.label || ""), k:Math.round(num(m.kcal)) || 0, p:Math.round(num(m.p)) || 0, ph:m.photo || null});
      });
    });
  }
  Object.keys(S.body).forEach(function(dt){
    var b = S.body[dt] || {};
    if ((num(b.kcal) > 0 || num(b.p) > 0) && !(S.food[dt] || []).length){
      S.food[dt] = [{n:"Day total", k:Math.round(num(b.kcal)) || 0, p:Math.round(num(b.p)) || 0}];
    }
    if (num(b.w) > 0) S.body[dt] = {w:num(b.w)}; else delete S.body[dt];
  });
  delete S.meals;
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){ storageOK = false; }
}

/* ---------- helpers ---------- */
function pad(n){ return String(n).padStart(2,"0"); }
function todayStr(){ var d = new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function parseDate(s){ var p = s.split("-").map(Number); return new Date(p[0], p[1]-1, p[2]); }
function dayOf(s){ return DAYS[(parseDate(s).getDay()+6)%7]; }
function nice(s){ var d = parseDate(s); return d.getDate()+" "+MON[d.getMonth()]; }
function daysSince(s){ return Math.round((parseDate(todayStr()) - parseDate(s)) / 86400000); }
function num(x){ var n = parseFloat(String(x).replace(",",".")); return isFinite(n) ? n : NaN; }
function r2(n){ return Math.round(n*100)/100; }
function fw(w){ return w === 0 ? "BW" : String(r2(w)); }
function fset(s, sep){ return fw(s[0]) + sep + s[1]; }
function vol(sets){ return sets.reduce(function(a,s){ return a + s[0]*s[1]; }, 0); }
function reps(sets){ return sets.reduce(function(a,s){ return a + s[1]; }, 0); }
function fvol(n){ return Math.round(n).toLocaleString("en-US"); }
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function cleanName(n){ n = String(n).replace(/\s+/g," ").trim(); return n ? n.charAt(0).toUpperCase() + n.slice(1) : ""; }
function cfg(n){ if (!S.ex[n]) S.ex[n] = Object.assign({}, S.defaults); return S.ex[n]; }
function names(){
  var seen = {}, out = [];
  Object.keys(S.ex).concat(Object.keys(S.log)).forEach(function(k){ if (!seen[k]){ seen[k]=1; out.push(k); } });
  return out;
}
function canon(n){
  var l = n.toLowerCase(), all = names();
  for (var i=0;i<all.length;i++) if (all[i].toLowerCase() === l) return all[i];
  return null;
}
function lev(a,b){
  a = a.toLowerCase(); b = b.toLowerCase();
  if (Math.abs(a.length-b.length) > 2) return 9;
  var prev = [], j, i;
  for (j=0;j<=b.length;j++) prev[j]=j;
  for (i=1;i<=a.length;i++){
    var cur=[i];
    for (j=1;j<=b.length;j++) cur[j] = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1] + (a[i-1]===b[j-1]?0:1));
    prev = cur;
  }
  return prev[b.length];
}
function near(nm){
  if (nm.length < 4) return null;
  var best=null, bd=3;
  names().forEach(function(k){ var d = lev(nm,k); if (d < bd){ bd=d; best=k; } });
  return bd <= 2 ? best : null;
}
function hasData(){
  return Object.keys(S.log).some(function(n){ return Object.keys(S.log[n]).length; });
}
function loggedDates(){
  var seen = {};
  Object.keys(S.log).forEach(function(n){ Object.keys(S.log[n]).forEach(function(d){ seen[d]=1; }); });
  return Object.keys(seen);
}

/* ---------- set parsing: 60x8, 60x8 | 3x8@60 | 60x8x3 | 60x10/8/6 | bw x 12 ---------- */
function parseSets(str){
  var s = String(str).toLowerCase().replace(/[×*]/g,"x").replace(/kgs?/g,"").replace(/body ?weight|\bbw/g,"0");
  var out = [], m;
  var re = /(\d+)\s*x\s*(\d+)\s*@\s*(\d+(?:[.,]\d+)?)|(\d+(?:[.,]\d+)?)\s*x\s*(\d+(?:\s*\/\s*\d+)*)(?:\s*x\s*(\d+))?/g;
  while ((m = re.exec(s))){
    if (m[1] !== undefined){
      var n1 = +m[1], r1 = +m[2], w1 = num(m[3]);
      for (var i=0;i<n1 && i<20;i++) out.push([w1, r1]);
    } else {
      var w = num(m[4]);
      var rs = m[5].split("/").map(function(x){ return +x.trim(); });
      var n = m[6] ? +m[6] : 1;
      for (var k=0;k<n && k<20;k++) rs.forEach(function(r){ out.push([w, r]); });
    }
  }
  return out.filter(function(x){ return isFinite(x[0]) && x[0] >= 0 && x[0] <= 1000 && x[1] >= 1 && x[1] <= 100; });
}

/* ---------- progression ----------
   Lighter sets BEFORE the first heaviest set = warm-ups / ramp sets: ignored.
   Lighter sets AFTER it = drop sets: they block an increase. */
function parts(sets){
  if (!sets || !sets.length) return {wu:[], work:[], top:0, drops:false};
  var top = Math.max.apply(null, sets.map(function(s){ return s[0]; }));
  var f = 0; while (sets[f][0] !== top) f++;
  var work = sets.slice(f);
  return {wu:sets.slice(0, f), work:work, top:top, drops:work.some(function(s){ return s[0] < top; })};
}
function earned(sets, c){
  var p = parts(sets);
  return p.work.length > 0 && !p.drops && p.work.every(function(s){ return s[1] >= c.hi; });
}
function lastSession(n, before){
  var L = S.log[n]; if (!L) return null;
  var ds = Object.keys(L).filter(function(d){ return d < before && L[d].length; }).sort();
  if (!ds.length) return null;
  var d = ds[ds.length-1];
  return [d, L[d]];
}
function target(n, last){
  if (!last || !last.length) return null;
  var c = cfg(n), p = parts(last), top = p.top;
  if (earned(last, c)){
    if (top === 0) return {add:true, w:0, reps:p.work.map(function(){ return c.hi+1; }), why:"Every set hit "+c.hi+". Add load or another set."};
    return {add:true, w:r2(top+c.inc), reps:p.work.map(function(){ return c.lo; }), why:"Every working set hit "+c.hi+" last time, so +"+fw(c.inc)+" kg."};
  }
  var tr = p.work.map(function(s){ return s[0] === top ? Math.min(c.hi, s[1]+1) : c.lo; });
  var tot = reps(p.work.filter(function(s){ return s[0] === top; }));
  var why = "Same weight. Beat "+tot+" reps at "+fw(top)+(top ? " kg" : "")+".";
  if (p.drops) why += " Keep every set at "+fw(top)+" this time.";
  return {add:false, w:top, reps:tr, why:why};
}
function warmups(w){
  if (!(w >= 20)) return [];
  var a = Math.round(w*0.5/2.5)*2.5, b = Math.round(w*0.75/2.5)*2.5, out = [];
  if (a > 0 && a < w) out.push([a, 10]);
  if (b > a && b < w) out.push([b, 5]);
  return out;
}

/* ---------- UI state ---------- */
var U = {view:"today", date:todayStr(), autoDate:true, day:null, drafts:{}, typing:{}, typed:{}, editing:null, pending:null, fallback:null, restoreText:"", restoreMsg:"", eraseArm:false, dl:null, hist:30, histEx:null, wDraft:null, fDraft:null, fEdit:false};
U.day = dayOf(U.date);

function draftFor(n){
  if (U.drafts[n]) return U.drafts[n];
  var c = cfg(n), today = (S.log[n]||{})[U.date] || [], prev = lastSession(n, U.date);
  var t = prev ? target(n, prev[1]) : null, i = today.length, w, r;
  if (t){
    var atT = today.filter(function(s){ return s[0] >= t.w; }).length;
    w = atT ? today[i-1][0] : t.w;
    r = t.reps[Math.min(atT, t.reps.length-1)];
  } else {
    w = i ? today[i-1][0] : "";
    r = i ? today[i-1][1] : c.lo;
  }
  return {w: w === "" ? "" : String(w), r: String(r)};
}

/* ---------- views ---------- */
function banner(){
  if (!storageOK) return '<p class="banner warn">This browser isn\'t saving your data. Copy your log from the Log tab before you close this page.</p>';
  if (!hasData()) return "";
  if (S.backupAt){
    var d = daysSince(S.backupAt);
    if (d < 7) return "";
    return '<button class="banner" data-act="gobackup">Last backup was '+d+' days ago. Copy your log to your notes.</button>';
  }
  if (loggedDates().length < 2) return "";
  return '<button class="banner" data-act="gobackup">Your log isn\'t backed up yet. Copy it to your notes.</button>';
}

function card(n, idx){
  var c = cfg(n), L = S.log[n] || {}, today = L[U.date] || [];
  var prev = lastSession(n, U.date), t = prev ? target(n, prev[1]) : null;
  var d = draftFor(n), done = earned(today, c), p = parts(today);
  var st = today.length ? (done ? "done" : "going") : (prev ? "due" : "new");
  var h = '<section class="ex st-'+st+'" data-name="'+esc(n)+'">';
  h += '<div class="ex-head"><h2 class="ex-name">'+esc(n)+'</h2><button class="range" data-act="edit" aria-label="Edit '+esc(n)+'">'+c.lo+'–'+c.hi+' reps, +'+fw(c.inc)+'</button></div>';
  if (prev){
    var pp = parts(prev[1]);
    h += '<p class="last">Last, <b>'+nice(prev[0])+'</b>: '+prev[1].map(function(s,k){ return '<span class="s'+(k < pp.wu.length ? ' w' : '')+'">'+fset(s,"×")+'</span>'; }).join("")+'</p>';
  } else {
    h += '<p class="last">No history yet. Log it and it becomes the target next time.</p>';
  }
  if (t){
    h += '<div class="beat'+(t.add ? " up" : "")+'"><span class="lbl">'+(t.add ? "Go up" : "Beat")+'</span><span class="num">'+fw(t.w)+'<small>'+(t.w ? "kg ×" : "×")+'</small>'+t.reps.join(" ")+'</span></div>';
    h += '<p class="note'+(t.add ? " gain" : "")+'">'+esc(t.why)+'</p>';
    var started = t.w > 0 && today.some(function(s){ return s[0] >= t.w; });
    var wus = (started || idx > 1) ? [] : warmups(t.w);
    if (wus.length){
      h += '<div class="wu-row"><span class="lbl">Warm up</span>'+wus.map(function(x){
        return '<button class="wuchip" data-act="fillwu" data-w="'+x[0]+'" data-r="'+x[1]+'" aria-label="Fill warm-up, '+fw(x[0])+' kg for '+x[1]+'">'+fw(x[0])+'×'+x[1]+'</button>';
      }).join("")+'</div>';
    }
  }
  if (today.length){
    h += '<div class="sets">'+today.map(function(s,k){
      var cls = k < p.wu.length ? " wu" : (s[0] < p.top ? " drop" : "");
      var kind = k < p.wu.length ? "warm-up " : (s[0] < p.top ? "drop set " : "set ");
      return '<span class="chip'+cls+'">'+fset(s,"×")+'<button data-act="delset" data-k="'+k+'" aria-label="Delete '+kind+fset(s," kg for ")+'">×</button></span>';
    }).join("")+'</div>';
    var v = vol(p.work), wn = p.work.length, pv = prev ? parts(prev[1]).work : null, line = "";
    if (p.wu.length) line += p.wu.length+" warm-up"+(p.wu.length>1?"s":"")+", ";
    line += wn+" working set"+(wn>1?"s":"");
    if (v > 0){
      line += ", "+fvol(v)+" kg";
      if (pv){ var dv = v - vol(pv); line += " ("+(dv>=0?"+":"−")+fvol(Math.abs(dv))+" vs last)"; }
    } else {
      line += ", "+reps(p.work)+" reps";
      if (pv){ var dr = reps(p.work) - reps(pv); line += " ("+(dr>=0?"+":"−")+Math.abs(dr)+" vs last)"; }
    }
    if (done) line += ". Every working set topped the range: +"+fw(c.inc)+" kg next time.";
    h += '<p class="note'+(done ? " gain" : "")+'">'+line+'</p>';
  }
  h += '<div class="entry">'
     +   '<div><div class="step"><button data-act="w-" aria-label="Less weight">−</button><input data-f="w" inputmode="decimal" enterkeyhint="done" value="'+esc(d.w)+'" placeholder="kg" aria-label="Weight in kg, 0 for bodyweight"><button data-act="w+" aria-label="More weight">+</button></div><div class="step-lbl">kg</div></div>'
     +   '<div><div class="step"><button data-act="r-" aria-label="Fewer reps">−</button><input data-f="r" inputmode="numeric" enterkeyhint="done" value="'+esc(d.r)+'" aria-label="Reps"><button data-act="r+" aria-label="More reps">+</button></div><div class="step-lbl">reps</div></div>'
     +   '<button class="logbtn" data-act="log">Log set '+(today.length+1)+'</button>'
     + '</div>';
  h += '<button class="link" data-act="type">'+(U.typing[n] ? "Hide typing" : "Type several sets")+'</button>';
  if (U.typing[n]){
    h += '<div class="typed"><input class="field" data-f="t" autocomplete="off" autocapitalize="off" value="'+esc(U.typed[n]||"")+'" placeholder="40x10, 60x8, 60x8, 60x7" aria-label="Sets"><button class="btn primary" data-act="logtyped">Add</button></div>'
       + '<p class="hint">Also works: 3x8@60, 60x8x3, 60x10/8/6, bw x 12. Lighter sets before your heaviest count as warm-ups.</p>';
  }
  if (U.editing === n){
    h += '<div class="settings">'
       +   '<label>Rep range <input class="field num" data-f="lo" inputmode="numeric" value="'+c.lo+'"> to <input class="field num" data-f="hi" inputmode="numeric" value="'+c.hi+'"></label>'
       +   '<label>Add <input class="field num" data-f="inc" inputmode="decimal" value="'+fw(c.inc)+'"> kg when every set reaches the top</label>'
       +   '<label>Name <input class="field grow" data-f="name" value="'+esc(n)+'"></label>'
       +   '<div class="row"><button class="btn primary" data-act="savecfg">Save</button><button class="btn" data-act="remove">Remove from '+U.day+'</button></div>'
       +   '<p class="hint">Removing only takes it off '+U.day+'. Its history stays. Renaming to an existing name merges the two.</p>'
       + '</div>';
  }
  return h + '</section>';
}

function addBlock(){
  var opts = names().filter(function(n){ return S.plan[U.day].indexOf(n) < 0; }).sort(function(a,b){ return a.localeCompare(b); });
  var h = '<div class="add"><label for="addname">Add exercise to '+U.day+'</label>'
        + '<div class="addrow"><input id="addname" class="field" list="known" autocomplete="off" autocapitalize="sentences" enterkeyhint="done" placeholder="Bench press"><button class="btn primary" data-act="add">Add</button></div>'
        + '<datalist id="known">'+opts.map(function(o){ return '<option value="'+esc(o)+'">'; }).join("")+'</datalist>';
  if (U.pending){
    h += '<div class="pending"><p>Did you mean <b>'+esc(U.pending.near)+'</b>?</p><div class="row">'
       + '<button class="btn primary" data-act="usenear">Use '+esc(U.pending.near)+'</button>'
       + '<button class="btn" data-act="keepnew">Add “'+esc(U.pending.typed)+'”</button></div></div>';
  }
  return h + '</div>';
}

function sessionRows(){
  return names().filter(function(n){ return ((S.log[n]||{})[U.date]||[]).length; }).map(function(n){ return [n, S.log[n][U.date]]; });
}
function sessionText(){
  var rows = sessionRows();
  var lines = [dayOf(U.date)+" "+U.date+", "+(S.schedule[U.day]||U.day)];
  var sets = 0, v = 0;
  rows.forEach(function(r){
    var c = cfg(r[0]), p = parts(r[1]);
    var nx = earned(r[1], c) ? "next +"+fw(c.inc)+" kg" : "next: hold "+fw(p.top);
    var wu = p.wu.length ? "warm-up "+p.wu.map(function(s){ return fset(s,"x"); }).join(", ")+" | " : "";
    lines.push(r[0]+": "+wu+p.work.map(function(s){ return fset(s,"x"); }).join(", ")+" ("+nx+")");
    sets += p.work.length; v += vol(p.work);
  });
  lines.push("Total: "+rows.length+" exercises, "+sets+" working sets, "+fvol(v)+" kg");
  return lines.join("\n");
}
function fallbackBox(text){
  return '<div class="fallback"><p class="note warn">Copy didn\'t go through on this phone. Press and hold the text, Select all, then Copy.</p><textarea class="field area small" readonly>'+esc(text)+'</textarea></div>';
}
function sessionBlock(){
  var rows = sessionRows(); if (!rows.length) return "";
  var sets = 0, v = 0, wu = 0;
  rows.forEach(function(r){ var p = parts(r[1]); sets += p.work.length; v += vol(p.work); wu += p.wu.length; });
  return '<section class="session"><h2>Session, '+nice(U.date)+'</h2>'
       + '<p class="totals"><span><b>'+rows.length+'</b>exercise'+(rows.length>1?"s":"")+'</span><span><b>'+sets+'</b>working sets</span><span><b>'+fvol(v)+'</b>kg moved</span></p>'
       + (wu ? '<p class="note" style="margin:-4px 0 10px">'+wu+' warm-up set'+(wu>1?"s":"")+' not counted.</p>' : '')
       + '<button class="btn" data-act="copysession">Copy session</button>'
       + (U.fallback && U.fallback.where === "session" ? fallbackBox(U.fallback.text) : "")
       + '</section>';
}

function viewToday(){
  var tday = dayOf(todayStr());
  var h = banner();
  h += '<div class="days" role="group" aria-label="Training day">'+DAYS.map(function(d){
    return '<button data-act="day" data-d="'+d+'" aria-pressed="'+(d===U.day)+'"'+(d===tday?' class="is-today"':'')+'>'+d+'</button>';
  }).join("")+'</div>';
  h += '<header class="dayhead"><h1>'+esc(S.schedule[U.day]||U.day)+'</h1><div class="dateline">'
     + '<label class="sr" for="date">Session date</label><input type="date" id="date" value="'+U.date+'" max="'+todayStr()+'">'
     + (U.date !== todayStr() ? '<button class="link" data-act="today">Back to today</button>' : '')
     + '</div>'
     + (U.day !== dayOf(U.date) ? '<p class="note">Doing '+U.day+'\'s plan on '+dayOf(U.date)+' '+nice(U.date)+'.</p>' : '')
     + '</header>';
  var list = S.plan[U.day].slice();
  names().forEach(function(n){ if (((S.log[n]||{})[U.date]||[]).length && list.indexOf(n) < 0) list.push(n); });
  if (!list.length){
    h += '<p class="empty">'+(/rest/i.test(S.schedule[U.day]||"")
      ? "Rest day. Add an exercise below if you're training anyway."
      : "Nothing planned for "+U.day+" yet. Add your first exercise below and it'll be here every "+U.day+".")+'</p>';
  }
  h += list.map(card).join("");
  h += addBlock();
  h += sessionBlock();
  return h;
}

function exportLog(){
  var order = [];
  DAYS.forEach(function(d){ S.plan[d].forEach(function(n){ if (order.indexOf(n) < 0) order.push(n); }); });
  var rest = names().filter(function(n){ return order.indexOf(n) < 0; }).sort(function(a,b){ return a.localeCompare(b); });
  var out = [];
  order.concat(rest).forEach(function(n){
    var L = S.log[n]; if (!L) return;
    var ds = Object.keys(L).filter(function(d){ return L[d].length; }).sort();
    if (!ds.length) return;
    var c = cfg(n);
    out.push([n+" ("+c.lo+"-"+c.hi+", +"+fw(c.inc)+")"].concat(ds.map(function(d){
      return "- "+d+": "+L[d].map(function(s){ return fset(s,"x"); }).join(", ");
    })).join("\n"));
  });
  var bd = {};
  Object.keys(S.body).forEach(function(d){ if (bw(d)) bd[d] = 1; });
  Object.keys(S.food).forEach(function(d){ if (food(d).length) bd[d] = 1; });
  var bds = Object.keys(bd).sort();
  if (bds.length){
    var td = todayStr(), cw = weekAvg(td, 0), ow = weekAvg(td, 7), wf = weekFood(td), mt = maintenance(td);
    var lines = ["BODY"];
    if (cw.n) lines.push("> Weight 7-day avg: "+fkg(cw.v)+" kg"+(cw.n >= 2 && ow.n >= 2 ? " ("+signed(cw.v - ow.v)+" vs previous 7 days)" : ""));
    if (wf.c) lines.push("> Food 7-day avg: "+Math.round(wf.k)+" kcal, "+Math.round(wf.p)+" g protein ("+wf.c+" fully counted days)");
    lines.push("> Targets: "+S.diet.kcal+" kcal, "+S.diet.p+" g protein"+(mt.ok ? ". Measured maintenance ~"+mt.v+" kcal" : ""));
    bds.forEach(function(d){
      lines.push("- "+d+":"+(bw(d) ? " "+fkg(bw(d))+" kg" : ""));
      food(d).forEach(function(x){
        lines.push("  * "+[x.t || "", x.n || "Food", x.k != null ? x.k+" kcal" : "", x.p != null ? x.p+" g" : ""].join(" | "));
      });
    });
    out.push(lines.join("\n"));
  }
  return out.join("\n\n");
}

function importBodyLine(d, rest){
  var wm = rest.match(/(\d+(?:[.,]\d+)?)\s*kg/i), km = rest.match(/(\d[\d,]*)\s*kcal/i), pm = rest.match(/(\d+)\s*(?:g\s*)?p\b/i);
  var got = false;
  if (wm && num(wm[1]) > 20){ S.body[d] = {w:num(wm[1])}; got = true; }
  if (km || pm){
    S.food[d] = [{n:"Day total", k:km ? parseInt(km[1].replace(/,/g,""), 10) : 0, p:pm ? parseInt(pm[1], 10) : 0}];
    got = true;
  }
  return got;
}

function parseFoodItem(line){
  var f = line.replace(/^\*\s*/, "").split("|").map(function(x){ return x.trim(); });
  if (f.length < 2) return {n:cleanName(f[0] || ""), k:null, p:null, t:""};
  var it = {t:/^\d{1,2}:\d{2}$/.test(f[0]) ? f[0] : "", n:cleanName(f[1] || ""), k:null, p:null};
  f.slice(2).forEach(function(x){
    var km = x.match(/^(\d+)\s*kcal$/i), pm = x.match(/^(\d+)\s*g$/i);
    if (km) it.k = +km[1]; else if (pm) it.p = +pm[1];
  });
  return it;
}

function importLog(text){
  var pend = null, cur = null, exSeen = {}, sess = 0, days = {}, mode = "ex", bodySeen = {}, bodyDate = null, itemsFor = {};
  String(text).split(/\r?\n/).forEach(function(raw){
    var line = raw.trim(); if (!line) return;
    if (line.charAt(0) === ">") return;
    if (/^body\b/i.test(line)){ mode = "body"; pend = null; cur = null; return; }
    var m = line.match(/^[-•*–]\s*(\d{4}-\d{2}-\d{2})\s*:?\s*(.*)$/);
    if (mode === "body"){
      if (m){ bodyDate = m[1]; if (importBodyLine(m[1], m[2])) bodySeen[m[1]] = 1; return; }
      if (/^\*\s/.test(line) && bodyDate){
        var it = parseFoodItem(line);
        if (it.n || it.k != null || it.p != null){
          if (!itemsFor[bodyDate]){ itemsFor[bodyDate] = 1; S.food[bodyDate] = []; }
          S.food[bodyDate].push(it); bodySeen[bodyDate] = 1;
        }
        return;
      }
      if (/^[-•*–]/.test(line)) return;
      mode = "ex";
    }
    if (m){
      if (!pend) return;
      var sets = parseSets(m[2]); if (!sets.length) return;
      if (!cur){
        cur = canon(pend.name) || pend.name;
        var c = cfg(cur);
        if (pend.lo){ c.lo = pend.lo; c.hi = pend.hi; }
        if (pend.inc > 0) c.inc = pend.inc;
      }
      if (!S.log[cur]) S.log[cur] = {};
      S.log[cur][m[1]] = sets; sess++; exSeen[cur] = 1; days[dayOf(m[1])] = 1;
      return;
    }
    if (/^[-•*–]/.test(line)) return;
    var hd = line.match(/^(.+?)\s*\(\s*(\d+)\s*[-–]\s*(\d+)\s*(?:,\s*\+?\s*(\d+(?:[.,]\d+)?)\s*(?:kg)?)?\s*\)\s*:?$/i);
    var nm = cleanName(hd ? hd[1] : line.replace(/:$/,""));
    pend = {name:nm, lo:hd ? +hd[2] : 0, hi:hd ? +hd[3] : 0, inc:hd && hd[4] ? num(hd[4]) : 0};
    if (pend.lo && (pend.hi < pend.lo || pend.lo < 1)){ pend.lo = 0; pend.hi = 0; }
    cur = null;
  });
  // An exercise goes on a weekday's plan only if it was done within 14 days of that weekday's
  // latest session, so lifts you've since swapped out stay in History but off Today.
  Object.keys(days).forEach(function(day){
    var all = loggedDates().filter(function(x){ return dayOf(x) === day; }).sort();
    var latest = all[all.length-1];
    names().forEach(function(n){
      var L = S.log[n] || {};
      var ds = Object.keys(L).filter(function(x){ return dayOf(x) === day && L[x].length; }).sort();
      if (!ds.length) return;
      var gap = (parseDate(latest) - parseDate(ds[ds.length-1])) / 86400000;
      if (gap <= 14 && S.plan[day].indexOf(n) < 0) S.plan[day].push(n);
    });
  });
  return {ex:Object.keys(exSeen).length, sess:sess, body:Object.keys(bodySeen).length};
}

function allSessions(){
  var by = {};
  Object.keys(S.log).forEach(function(n){
    Object.keys(S.log[n]).forEach(function(d){
      if (S.log[n][d].length){ if (!by[d]) by[d] = []; by[d].push([n, S.log[n][d]]); }
    });
  });
  return by;
}
function planDayFor(rows, date){
  var best = null, bc = 0;
  DAYS.forEach(function(d){
    var k = rows.filter(function(r){ return S.plan[d].indexOf(r[0]) >= 0; }).length;
    if (k > bc){ bc = k; best = d; }
  });
  return best || dayOf(date);
}
function addDays(s, k){ var d = parseDate(s); d.setDate(d.getDate()+k); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function fmtWork(work){
  if (!work.length) return "";
  var w0 = work[0][0];
  if (work.every(function(s){ return s[0] === w0; })) return fw(w0)+(w0 ? " kg" : "")+" × "+work.map(function(s){ return s[1]; }).join(", ");
  return work.map(function(s){ return fset(s,"×"); }).join(", ");
}
function e1(sets){
  var best = 0;
  sets.forEach(function(s){ var v = s[0]*(1+s[1]/30); if (v > best) best = v; });
  return best;
}
function spark(vals){
  var W = 300, H = 64, m = 6;
  var mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals), span = (mx - mn) || 1;
  var pts = vals.map(function(v,i){ return [m + i*(W-2*m)/(vals.length-1), H - m - (v-mn)*(H-2*m)/span]; });
  var last = pts[pts.length-1];
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Trend across '+vals.length+' sessions">'
       + '<polyline fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="'+pts.map(function(p){ return p[0].toFixed(1)+","+p[1].toFixed(1); }).join(" ")+'"/>'
       + '<circle cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="4.5" fill="var(--accent)"/></svg>';
}
function progressPanel(n){
  var L = S.log[n] || {}, c = cfg(n);
  var ds = Object.keys(L).filter(function(d){ return L[d].length; }).sort();
  var h = '<div class="prog"><div class="hhead"><h2>'+esc(n)+'</h2><span class="focus">'+c.lo+'–'+c.hi+' reps, +'+fw(c.inc)+'</span><button class="link" data-act="histclose">Close</button></div>';
  if (!ds.length) return h + '<p class="note">No sessions yet.</p></div>';
  var weighted = ds.some(function(d){ return L[d].some(function(s){ return s[0] > 0; }); });
  var pts = [];
  ds.forEach(function(d){
    var work = parts(L[d]).work;
    var v = weighted ? e1(work.filter(function(s){ return s[0] > 0; })) : reps(work);
    if (v > 0) pts.push([d, v]);
  });
  if (pts.length >= 2){
    var a = pts[0], b = pts[pts.length-1], diff = Math.round(b[1]) - Math.round(a[1]), unit = weighted ? " kg" : " reps";
    h += '<p class="note">'+(weighted ? "Estimated 1-rep max" : "Total reps")+': '+Math.round(a[1])+' → <b>'+Math.round(b[1])+unit+'</b> ('+(diff>=0?"+":"−")+Math.abs(diff)+unit+' since '+nice(a[0])+')</p>';
    h += spark(pts.map(function(x){ return x[1]; }));
  }
  h += ds.slice().reverse().map(function(d){
    var p = parts(L[d]);
    return '<div class="prow"><span>'+dayOf(d)+' '+nice(d)+'</span><span>'+fmtWork(p.work)+(earned(L[d], c) ? ' <span class="up">+'+fw(c.inc)+'</span>' : '')+'</span></div>';
  }).join("");
  return h + '</div>';
}
function viewHistory(){
  var by = allSessions(), R = U.hist;

  var h = '<header class="dayhead"><h1>History</h1></header>';

    return '<button data-act="hrange" data-k="'+o[0]+'" aria-pressed="'+(R === o[0])+'">'+o[1]+'</button>';
  }).join("")+'</div>';
  if (U.histEx) h += progressPanel(U.histEx);
  if (!dates.length){
    return h + '<p class="empty">'+(hasData() ? "No workouts in this range. Pick a longer one." : "Nothing logged yet. Workouts you log on Today show up here, newest first.")+'</p>';
  }
  var tSets = 0, tVol = 0;
  var body = dates.map(function(d){
    var rows = by[d].slice(), pd = planDayFor(rows, d), sets = 0, v = 0;
    rows.sort(function(a,b){ var ia = S.plan[pd].indexOf(a[0]), ib = S.plan[pd].indexOf(b[0]); return (ia<0?99:ia) - (ib<0?99:ib); });
    var inner = rows.map(function(r){
      var c = cfg(r[0]), p = parts(r[1]);
      sets += p.work.length; v += vol(p.work);
      return '<div class="hrow"><button class="hex" data-act="histex" data-name="'+esc(r[0])+'">'+esc(r[0])+'</button>'
           + (earned(r[1], c) ? '<span class="up">+'+fw(c.inc)+' next</span>' : '<span></span>')
           + '<div class="hsets">'+(p.wu.length ? '<span class="w">'+p.wu.map(function(s){ return fset(s,"×"); }).join(" ")+'</span>' : '')+fmtWork(p.work)+'</div></div>';
    }).join("");
    tSets += sets; tVol += v;
    return '<article class="hsess"><div class="hhead"><h2>'+dayOf(d)+' '+nice(d)+'</h2><span class="focus">'+esc(S.schedule[pd] || pd)+'</span><button class="link" data-act="openday" data-date="'+d+'" data-d="'+pd+'">Open</button></div>'
         + inner + '<p class="htot">'+rows.length+' exercise'+(rows.length>1?"s":"")+', '+sets+' working sets, '+fvol(v)+' kg</p></article>';
  }).join("");
  h += '<p class="totals" style="margin-top:16px"><span><b>'+dates.length+'</b>workout'+(dates.length>1?"s":"")+'</span><span><b>'+tSets+'</b>working sets</span><span><b>'+fvol(tVol)+'</b>kg</span></p>';
  return h + body;
}

/* ---------- photos: kept apart from the log so a big image can never break it ---------- */
var PIX = (function(){
  var dbp = null;
  function open(){
    if (dbp) return dbp;
    dbp = new Promise(function(res, rej){
      var rq = indexedDB.open("overload-photos", 1);
      rq.onupgradeneeded = function(){ rq.result.createObjectStore("photos"); };
      rq.onsuccess = function(){ res(rq.result); };
      rq.onerror = function(){ rej(rq.error); };
    });
    return dbp;
  }
  function run(mode, fn){
    return open().then(function(db){
      return new Promise(function(res, rej){
        var rq = fn(db.transaction("photos", mode).objectStore("photos"));
        rq.onsuccess = function(){ res(rq.result); };
        rq.onerror = function(){ rej(rq.error); };
      });
    });
  }
  return {
    put: function(id, blob){ return run("readwrite", function(st){ return st.put(blob, id); }); },
    get: function(id){ return run("readonly", function(st){ return st.get(id); }); },
    del: function(id){ return run("readwrite", function(st){ return st.delete(id); }); }
  };
})();
function loadImg(blob){
  return new Promise(function(res, rej){
    var url = URL.createObjectURL(blob), img = new Image();
    img.onload = function(){ URL.revokeObjectURL(url); res(img); };
    img.onerror = function(){ URL.revokeObjectURL(url); rej(new Error("decode")); };
    img.src = url;
  });
}
function toJpeg(cv, q){ return new Promise(function(res, rej){ cv.toBlob(function(b){ b ? res(b) : rej(new Error("encode")); }, "image/jpeg", q); }); }
// Phone photos are 3-5 MB; 1000 px at 0.72 lands around 100 kB and still shows the plate clearly.
function shrink(file){
  return loadImg(file).then(function(img){
    var sc = Math.min(1, 1000 / Math.max(img.width, img.height)), cv = document.createElement("canvas");
    cv.width = Math.round(img.width*sc); cv.height = Math.round(img.height*sc);
    cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
    return toJpeg(cv, 0.72);
  });
}
// Burn "Photo 3, Tue 6 Oct 13:10, Chicken rice" into the image so Claude can match it to the list.
function captioned(blob, label){
  return loadImg(blob).then(function(img){
    var cv = document.createElement("canvas"), g = cv.getContext("2d");
    cv.width = img.width; cv.height = img.height; g.drawImage(img, 0, 0);
    var bh = Math.max(44, Math.round(img.width*0.075));
    g.fillStyle = "rgba(0,0,0,0.72)"; g.fillRect(0, img.height-bh, img.width, bh);
    g.fillStyle = "#fff"; g.textBaseline = "middle";
    g.font = "600 "+Math.round(bh*0.48)+"px system-ui, -apple-system, sans-serif";
    var txt = label;
    while (g.measureText(txt).width > img.width-24 && txt.length > 6) txt = txt.slice(0, -2);
    if (txt !== label) txt += "…";
    g.fillText(txt, 12, img.height - bh/2);
    return toJpeg(cv, 0.8);
  });
}
function paintPix(){
  var els = document.querySelectorAll("img[data-pix]");
  for (var i = 0; i < els.length; i++) (function(el){
    PIX.get(el.getAttribute("data-pix")).then(function(b){ if (b) el.src = URL.createObjectURL(b); }).catch(function(){});
  })(els[i]);
}
// Photos older than 8 weeks are deleted (the food text stays). Keeps storage near 20 MB.
function prunePhotos(){
  var cutoff = addDays(todayStr(), -56), changed = false;
  Object.keys(S.food).forEach(function(d){
    if (d >= cutoff) return;
    food(d).forEach(function(x){ if (x.ph){ PIX.del(x.ph).catch(function(){}); x.ph = null; changed = true; } });
  });
  if (changed) save();
}

/* ---------- body: weight + food ---------- */
function mean(a){ return a.reduce(function(x,y){ return x+y; }, 0) / a.length; }
function fkg(v){ return (Math.round(v*10)/10).toFixed(1); }
function signed(v){ return (v < 0 ? "−" : "+") + fkg(Math.abs(v)); }
function bw(d){ var b = S.body[d]; return b && b.w > 0 ? b.w : null; }
function food(d){ return S.food[d] || []; }
function foodTot(d){
  var k = 0, p = 0, miss = 0;
  food(d).forEach(function(x){ k += x.k || 0; p += x.p || 0; if (x.k == null) miss++; });
  return {k:k, p:p, n:food(d).length, miss:miss};
}
function complete(d){ var t = foodTot(d); return t.n > 0 && t.miss === 0 && t.k > 0; }
function hhmm(){ var n = new Date(); return pad(n.getHours())+":"+pad(n.getMinutes()); }
function fnums(x){ return x.k == null && x.p == null ? "" : (x.k != null ? fvol(x.k)+" kcal" : "?")+(x.p != null ? ", "+x.p+" g" : ""); }
function lastWeighIn(before){
  var ds = Object.keys(S.body).filter(function(x){ return x < before && bw(x); }).sort();
  return ds.length ? [ds[ds.length-1], bw(ds[ds.length-1])] : null;
}
function span(end, len, back){ var out = []; for (var i = back+len-1; i >= back; i--) out.push(addDays(end, -i)); return out; }
function weekAvg(end, back){ var ws = span(end, 7, back).map(bw).filter(Boolean); return {n:ws.length, v:ws.length ? mean(ws) : null}; }
function weekFood(end){
  var all = span(end, 7, 0), ds = all.filter(complete);
  return {n:all.filter(function(d){ return food(d).length; }).length, c:ds.length,
          k:ds.length ? mean(ds.map(function(d){ return foodTot(d).k; })) : null,
          p:ds.length ? mean(ds.map(function(d){ return foodTot(d).p; })) : null};
}
// Maintenance from your own numbers: average intake minus the energy in your weight trend
// (least-squares slope over the last 28 days, 7,700 kcal per kg).
function maintenance(end){
  var ds = span(end, 28, 0), pts = [];
  ds.forEach(function(d, i){ var w = bw(d); if (w) pts.push([i, w]); });
  var fd = ds.filter(complete);
  var ok = pts.length >= 10 && fd.length >= 10 && pts[pts.length-1][0] - pts[0][0] >= 13;
  if (!ok) return {ok:false, w:pts.length, f:fd.length};
  var mx = mean(pts.map(function(q){ return q[0]; })), my = mean(pts.map(function(q){ return q[1]; })), a = 0, b = 0;
  pts.forEach(function(q){ a += (q[0]-mx)*(q[1]-my); b += (q[0]-mx)*(q[0]-mx); });
  var slope = b ? a/b : 0;
  return {ok:true, v:Math.round((mean(fd.map(function(d){ return foodTot(d).k; })) - slope*7700)/10)*10, weekly:slope*7};
}
function recentFoods(d){
  var seen = {}, out = [];
  Object.keys(S.food).filter(function(x){ return x <= d; }).sort().reverse().forEach(function(x){
    food(x).slice().reverse().forEach(function(it){
      if (out.length >= 6 || !it.n || it.n === "Day total") return;
      var key = it.n.toLowerCase(); if (seen[key]) return;
      seen[key] = 1; out.push(it);
    });
  });
  return out;
}

}

function weekData(end){
  var pix = [];
  var text = weekText(end, function(d, x){
    pix.push({id:x.ph, label:"Photo "+(pix.length+1)+", "+dayOf(d)+" "+nice(d)+(x.t ? " "+x.t : "")+(x.n ? ", "+x.n : "")});
    return pix.length;
  });
  return {text:text, pix:pix};
}
function weekText(end, onPhoto){
  var days = span(end, 7, 0), T = S.diet, cw = weekAvg(end, 0), ow = weekAvg(end, 7), mt = maintenance(end);
  var L = ["Weekly review, "+nice(days[0])+" to "+nice(end)+" "+end.slice(0,4),
           "Targets: "+T.kcal+" kcal and "+T.p+" g protein a day."];
  if (cw.n) L.push("Weight 7-day average: "+fkg(cw.v)+" kg"+(cw.n >= 2 && ow.n >= 2 ? " ("+signed(cw.v - ow.v)+" kg vs the previous 7 days)" : "")+".");
  if (mt.ok) L.push("Measured maintenance from my logs: about "+mt.v+" kcal.");
  var tS = 0, tW = 0, tV = 0;
  days.forEach(function(d){
    var rows = names().filter(function(n){ return ((S.log[n]||{})[d]||[]).length; }).map(function(n){ return [n, S.log[n][d]]; });
    var pd = rows.length ? planDayFor(rows, d) : null;
    if (pd) rows.sort(function(a,b){ var ia = S.plan[pd].indexOf(a[0]), ib = S.plan[pd].indexOf(b[0]); return (ia<0?99:ia) - (ib<0?99:ib); });
    L.push(""); L.push(dayOf(d)+" "+nice(d)+(bw(d) ? ", weight "+fkg(bw(d))+" kg" : "")+".");
    if (rows.length){
      tS++;
      L.push("Training ("+(S.schedule[pd] || "workout")+"):");
      rows.forEach(function(r){
        var c = cfg(r[0]), p = parts(r[1]);
        tW += p.work.length; tV += vol(p.work);
        var wu = p.wu.length ? "warm-up "+p.wu.map(function(x){ return fset(x,"x"); }).join(", ")+" | " : "";
        var nx = earned(r[1], c) ? "top of range, next +"+fw(c.inc)+" kg" : "next: same weight";
        L.push("- "+r[0]+" ("+c.lo+"-"+c.hi+" reps): "+wu+p.work.map(function(x){ return fset(x,"x"); }).join(", ")+" ("+nx+")");
      });
    } else L.push("No training.");
    var f = food(d);
    if (!f.length){ L.push("Food: none logged."); return; }
    L.push("Food:");
    f.forEach(function(x){
      var tag = (x.ph && onPhoto) ? " [photo "+onPhoto(d, x)+"]" : "";
      L.push("- "+(x.t ? x.t+" " : "")+(x.n || (x.ph ? "Meal" : "Food"))+tag+(fnums(x) ? ": "+fnums(x) : ": no numbers"));
    });
    var t = foodTot(d);
    L.push("Logged: "+t.k+" kcal, "+t.p+" g protein"+(t.miss ? " ("+t.miss+" item"+(t.miss>1?"s":"")+" without numbers)" : "")+".");
  });
  L.push("");
  L.push("");
  L.push("Training this week: "+tS+" session"+(tS===1?"":"s")+", "+tW+" working sets, "+fvol(tV)+" kg moved.");
  if (onPhoto && L.join("\n").indexOf("[photo ") >= 0) L.push("Photos are attached, numbered to match [photo N] above. Use them to judge portion sizes.");
  L.push("Please estimate calories and protein for any items without numbers, then give me: my average daily calories and protein, how many days I hit "+T.p+" g protein, how my intake lines up with my weight trend and my lifts, patterns worth fixing (timing, weekends, snacks, drinks), and 2 or 3 specific changes for next week.");
  return L.join("\n");
}

function viewLog(){
  var txt = exportLog();
  var h = '<header class="dayhead"><h1>Your log</h1><p class="note">'
        + (S.backupAt ? "Last copied "+nice(S.backupAt)+(daysSince(S.backupAt) ? ", "+daysSince(S.backupAt)+" day"+(daysSince(S.backupAt)>1?"s":"")+" ago." : ", today.") : "Not copied anywhere yet.")
        + '</p></header>';
  if (!txt){
    h += '<p class="empty">Nothing logged yet. Log a set on Today and it shows up here, ready to paste into your notes.</p>';
  } else {
    h += '<div class="row"><button class="btn primary" data-act="copylog">Copy log</button>'
       + (U.dl ? '<button class="btn" data-act="savefile">Save as file</button>' : '')
       + '</div>';
    if (U.fallback && U.fallback.where === "log") h += '<p class="note warn" style="margin-top:10px">Copy didn\'t go through on this phone. Press and hold the text below, Select all, then Copy.</p>';
    h += '<textarea class="field area" readonly aria-label="Full log">'+esc(txt)+'</textarea>';
    h += '<p class="note">Paste it into your notes once a week. It\'s also the format to paste into Claude for a review.</p>';
  }
  h += '<section><h2>Restore from a copied log</h2>'
     + '<p class="note">Paste a log in the format above. Dates you paste replace the same dates here; everything else is kept.</p>'
     + '<textarea id="restore" class="field area small" autocapitalize="off" placeholder="Bench press (6-8, +2.5)&#10;- 2026-10-06: 60x8, 60x8, 60x7">'+esc(U.restoreText)+'</textarea>'
     + '<div class="row"><button class="btn primary" data-act="restore">Restore</button><label class="btn filebtn">Load a .txt file<input id="restorefile" class="sr" type="file" accept=".txt,text/plain"></label></div>'
     + (U.restoreMsg ? '<p class="note" style="margin-top:8px">'+esc(U.restoreMsg)+'</p>' : '')
     + '</section>';
  return h;
}

function viewSetup(){
  var h = '<header class="dayhead"><h1>Setup</h1></header>';
  h += '<section><h2>Weekly schedule</h2><div class="sched">'+DAYS.map(function(d){
    return '<label class="schedrow"><span>'+d+'</span><input class="field" data-sched="'+d+'" value="'+esc(S.schedule[d])+'" aria-label="'+d+' focus"></label>';
  }).join("")+'</div></section>';
  h += '<section><h2>New exercises start at</h2><div class="defs">'
     + '<label><input class="field num" data-def="lo" inputmode="numeric" value="'+S.defaults.lo+'" aria-label="Lowest reps"> to <input class="field num" data-def="hi" inputmode="numeric" value="'+S.defaults.hi+'" aria-label="Highest reps"> reps</label>'
     + '<label>add <input class="field num" data-def="inc" inputmode="decimal" value="'+fw(S.defaults.inc)+'" aria-label="Weight increase in kg"> kg</label>'
     + '</div><p class="note">To change one exercise, tap its rep range on Today.</p></section>';
  h += '<section><h2>How targets work</h2><p>When every working set reaches the top of the rep range at your heaviest weight, the next target adds weight and starts back at the bottom of the range. Otherwise it keeps the weight and asks for one more rep per set. Lighter sets before your heaviest set count as warm-ups and are ignored. Lighter sets after it count as drop sets and hold the weight. Kg moved counts working sets only.</p></section>';
  h += '<section><h2>Where your data lives</h2><p>Only in this browser on this phone, including your weight and food. Open it the same way every time (same browser, or the same home-screen icon), because each keeps its own copy. Clearing browser data erases it, so copy your log to your notes every week.</p></section>';
  h += '<section><button class="btn danger" data-act="erase">'+(U.eraseArm ? "Tap again to erase everything" : "Erase all data")+'</button></section>';
  return h;
}

function render(){
  var app = document.getElementById("app");
  app.innerHTML = U.view === "today" ? viewToday() : U.view === "history" ? viewHistory() : U.view === "body" ? viewBody() : U.view === "log" ? viewLog() : viewSetup();
  var tabs = document.querySelectorAll("nav.tabs button");
  for (var i=0;i<tabs.length;i++) tabs[i].setAttribute("aria-current", tabs[i].getAttribute("data-view") === U.view ? "page" : "false");
  if (U.view === "body") paintPix();
}

var tt;
function toast(msg){
  var el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("on");
  clearTimeout(tt); tt = setTimeout(function(){ el.classList.remove("on"); }, 2400);
}

function copyText(t){
  return new Promise(function(resolve){
    function legacy(){
      try {
        var ta = document.createElement("textarea");
        ta.value = t; ta.setAttribute("readonly","");
        ta.style.cssText = "position:fixed;top:0;left:0;opacity:0;";
        document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0, t.length);
        var ok = document.execCommand("copy");
        document.body.removeChild(ta);
        resolve(!!ok);
      } catch(e){ resolve(false); }
    }
    if (navigator.clipboard && navigator.clipboard.writeText){
      var settled = false;
      var timer = setTimeout(function(){ if (!settled){ settled = true; legacy(); } }, 1500);
      navigator.clipboard.writeText(t).then(function(){
        if (!settled){ settled = true; clearTimeout(timer); resolve(true); }
      }, function(){
        if (!settled){ settled = true; clearTimeout(timer); legacy(); }
      });
    } else legacy();
  });
}
function copyFlow(text, where){
  copyText(text).then(function(ok){
    if (where === "log"){ S.backupAt = todayStr(); save(); }
    U.fallback = ok ? null : {where:where, text:text};
    render();
    if (ok) toast(where === "log" ? "Log copied. Paste it into your notes." : where === "week" ? "Week copied. Paste it into Claude." : "Session copied");
  });
}

/* ---------- actions ---------- */
function addEx(raw, force){
  var nm = cleanName(raw);
  if (!nm){ toast("Type an exercise name first."); return; }
  var n = canon(nm);
  if (!n && !force){
    var nr = near(nm);
    if (nr){ U.pending = {typed:nm, near:nr}; render(); return; }
  }
  n = n || nm;
  cfg(n);
  if (S.plan[U.day].indexOf(n) < 0) S.plan[U.day].push(n);
  U.pending = null; save(); render();
  toast(n+" added to "+U.day);
}
function renameEx(oldN, newN){
  var hit = canon(newN);
  var dest = (hit && hit !== oldN) ? hit : newN;
  if (dest === oldN) return oldN;
  var L = S.log[oldN];
  if (L){
    if (!S.log[dest]) S.log[dest] = {};
    Object.keys(L).forEach(function(d){ S.log[dest][d] = (S.log[dest][d] || []).concat(L[d]); });
    delete S.log[oldN];
  }
  if (!S.ex[dest]) S.ex[dest] = S.ex[oldN] || Object.assign({}, S.defaults);
  delete S.ex[oldN];
  DAYS.forEach(function(d){
    var seen = {};
    S.plan[d] = S.plan[d].map(function(x){ return x === oldN ? dest : x; }).filter(function(x){ if (seen[x]) return false; seen[x]=1; return true; });
  });
  return dest;
}
function pushSets(n, sets){
  if (!S.log[n]) S.log[n] = {};
  if (!S.log[n][U.date]) S.log[n][U.date] = [];
  sets.forEach(function(s){ S.log[n][U.date].push([r2(s[0]), s[1]]); });
  delete U.drafts[n];
  save();
}

document.addEventListener("click", function(e){
  var b = e.target.closest("[data-act]"); if (!b) return;
  var act = b.getAttribute("data-act");
  var cardEl = b.closest(".ex");
  var n = cardEl ? cardEl.getAttribute("data-name") : null;
  var d, c, base, w, r, sets;
  switch (act){
    case "tab":
      U.view = b.getAttribute("data-view"); U.fallback = null; U.eraseArm = false; U.restoreMsg = "";
      render(); try { window.scrollTo(0,0); } catch(_){} break;
    case "day":
      U.day = b.getAttribute("data-d"); U.drafts = {}; U.editing = null; U.pending = null; U.fallback = null; render(); break;
    case "today":
      U.date = todayStr(); U.autoDate = true; U.day = dayOf(U.date); U.drafts = {}; U.fallback = null; U.wDraft = null; U.fDraft = null; render(); break;
    case "w-": case "w+":
      d = Object.assign({}, draftFor(n)); c = cfg(n);
      base = num(d.w); if (!isFinite(base)) base = 0;
      d.w = String(Math.max(0, r2(base + (act === "w+" ? c.inc : -c.inc))));
      U.drafts[n] = d; render(); break;
    case "r-": case "r+":
      d = Object.assign({}, draftFor(n));
      base = parseInt(d.r, 10); if (!(base >= 0)) base = 0;
      d.r = String(Math.max(1, base + (act === "r+" ? 1 : -1)));
      U.drafts[n] = d; render(); break;
    case "log":
      d = draftFor(n); w = num(d.w); r = parseInt(d.r, 10);
      if (!isFinite(w) || w < 0 || w > 1000){ toast("Enter a weight. Use 0 for bodyweight."); break; }
      if (!(r >= 1 && r <= 100)){ toast("Enter how many reps you did."); break; }
      pushSets(n, [[w, r]]);
      render();
      toast(n+", set "+S.log[n][U.date].length+": "+fset([r2(w), r], "×"));
      break;
    case "delset":
      var arr = (S.log[n]||{})[U.date];
      if (arr){
        arr.splice(+b.getAttribute("data-k"), 1);
        if (!arr.length) delete S.log[n][U.date];
        if (!Object.keys(S.log[n]).length) delete S.log[n];
      }
      delete U.drafts[n]; save(); render(); toast("Set deleted"); break;
    case "type":
      U.typing[n] = !U.typing[n]; render();
      if (U.typing[n]){
        var inp = document.querySelector('.ex[data-name="'+cssEsc(n)+'"] [data-f="t"]');
        if (inp) inp.focus();
      }
      break;
    case "logtyped":
      sets = parseSets(U.typed[n] || "");
      if (!sets.length){ toast("Couldn't read that. Try 60x8, 60x8, 60x7"); break; }
      pushSets(n, sets); U.typed[n] = ""; U.typing[n] = false; render();
      toast(n+": "+sets.length+" set"+(sets.length>1?"s":"")+" added"); break;
    case "edit":
      U.editing = U.editing === n ? null : n; render(); break;
    case "savecfg":
      var q = function(f){ return cardEl.querySelector('[data-f="'+f+'"]').value; };
      var lo = parseInt(q("lo"),10), hi = parseInt(q("hi"),10), inc = num(q("inc"));
      if (!(lo >= 1 && hi >= lo && hi <= 100)){ toast("Rep range needs a low number and a high number at least as big."); break; }
      if (!(inc > 0 && inc <= 50)){ toast("The increase has to be more than 0 kg."); break; }
      c = cfg(n); c.lo = lo; c.hi = hi; c.inc = r2(inc);
      var nn = cleanName(q("name")), fin = n;
      if (nn && nn !== n) fin = renameEx(n, nn);
      U.editing = null; delete U.drafts[n]; delete U.drafts[fin]; save(); render(); toast("Saved "+fin); break;
    case "remove":
      S.plan[U.day] = S.plan[U.day].filter(function(x){ return x !== n; });
      U.editing = null; save(); render(); toast("Removed from "+U.day+". History kept."); break;
    case "add":
      addEx(document.getElementById("addname").value); break;
    case "usenear":
      if (U.pending) addEx(U.pending.near); break;
    case "keepnew":
      if (U.pending) addEx(U.pending.typed, true); break;
    case "copysession":
      copyFlow(sessionText(), "session"); break;
    case "copylog":
      copyFlow(exportLog(), "log"); break;
    case "savefile":
      if (!U.dl) break;
      U.dl.save({filename:"workout-log-"+todayStr()+".txt", data:exportLog()}).then(function(){
        S.backupAt = todayStr(); save(); render(); toast("Log saved as a file");
      }, function(err){
        var code = err && err.code;
        if (code === "declined"){ toast("Not saved"); }
        else if (code === "rate_limited"){ toast("A save is already open. Try again in a moment."); }
        else { U.dl = null; render(); toast("Saving files isn't available here. Use Copy log."); }
      });
      break;
    case "restore":
      if (!U.restoreText.trim()){ toast("Paste a log first."); break; }
      var res = importLog(U.restoreText);
      if (!res.sess && !res.body){ U.restoreMsg = "Nothing restored. Each exercise needs a name line, then lines like - 2026-10-06: 60x8, 60x8"; }
      else {
        U.restoreMsg = "Restored "+res.ex+" exercise"+(res.ex===1?"":"s")+", "+res.sess+" session"+(res.sess===1?"":"s")+(res.body ? " and "+res.body+" body day"+(res.body===1?"":"s") : "")+".";
        U.restoreText = ""; save();
      }
      U.drafts = {}; render(); break;
    case "erase":
      if (!U.eraseArm){
        U.eraseArm = true; render();
        setTimeout(function(){ if (U.eraseArm){ U.eraseArm = false; if (U.view === "setup") render(); } }, 4000);
      } else {
        S = blank(); save(); U.eraseArm = false; U.drafts = {}; U.typing = {}; U.typed = {}; render(); toast("All data erased");
      }
      break;
    case "fillwu":
      U.drafts[n] = {w: b.getAttribute("data-w"), r: b.getAttribute("data-r")}; render(); break;
    case "hrange":
      U.hist = +b.getAttribute("data-k"); render(); break;
    case "histex":
      U.histEx = b.getAttribute("data-name"); render(); try { window.scrollTo(0,0); } catch(_){} break;
    case "histclose":
      U.histEx = null; render(); break;
    case "openday":
      U.date = b.getAttribute("data-date"); U.autoDate = (U.date === todayStr()); U.day = b.getAttribute("data-d");
      U.view = "today"; U.drafts = {}; U.editing = null; U.fallback = null; render(); try { window.scrollTo(0,0); } catch(_){} break;
    case "bw-": case "bw+":
      var wv = num(U.wDraft != null ? U.wDraft : (document.querySelector('[data-f="bw"]') || {}).value);
      if (!isFinite(wv)) wv = 0;
      U.wDraft = fkg(Math.max(0, wv + (act === "bw+" ? 0.1 : -0.1))); render(); break;
    case "wlog":
      var wl = num(U.wDraft != null ? U.wDraft : (document.querySelector('[data-f="bw"]') || {}).value);
      if (!(wl >= 30 && wl <= 300)){ toast("Enter your weight in kg."); break; }
      S.body[U.date] = {w:Math.round(wl*10)/10}; U.wDraft = null; save(); render(); toast("Weight logged: "+fkg(wl)+" kg"); break;
    case "wdel":
      delete S.body[U.date]; U.wDraft = null; save(); render(); toast("Weigh-in deleted"); break;
    case "fk-": case "fk+": case "fp-": case "fp+":
      var fd0 = Object.assign({}, fDraft()), key = act.charAt(1), stepv = key === "k" ? 50 : 5;
      var cv = parseInt(fd0[key], 10); if (!(cv >= 0)) cv = 0;
      fd0[key] = String(Math.max(0, cv + (act.charAt(2) === "+" ? stepv : -stepv)));
      U.fDraft = fd0; render(); break;
    case "fadd":
      var fa = fDraft(), fnm = cleanName(fa.n).replace(/\|/g, "/");
      var fk = String(fa.k).trim() === "" ? null : parseInt(fa.k, 10), fp = String(fa.p).trim() === "" ? null : parseInt(fa.p, 10);
      if (!(fk >= 0)) fk = null; if (!(fp >= 0)) fp = null;
      if (!fnm && !fk && !fp && !fa.ph){ toast("Type what you ate or add a photo."); break; }
      if (!S.food[U.date]) S.food[U.date] = [];
      S.food[U.date].push({n:fnm, k:fk, p:fp, t:U.date === todayStr() ? hhmm() : "", ph:fa.ph || null});
      U.fDraft = null; save(); render(); toast("Added "+(fnm || "food")); break;
    case "fquick":
      var qf = recentFoods(U.date)[+b.getAttribute("data-k")]; if (!qf) break;
      if (!S.food[U.date]) S.food[U.date] = [];
      S.food[U.date].push({n:qf.n, k:qf.k, p:qf.p, t:U.date === todayStr() ? hhmm() : ""}); save(); render(); toast("Added "+qf.n); break;
    case "fdel":
      var fl = S.food[U.date] || [], gone = fl[+b.getAttribute("data-k")];
      if (gone && gone.ph) PIX.del(gone.ph).catch(function(){});
      fl.splice(+b.getAttribute("data-k"), 1);
      if (!fl.length) delete S.food[U.date];
      save(); render(); toast("Removed"); break;
    case "fphotodel":
      var fdp = Object.assign({}, fDraft());
      if (fdp.ph) PIX.del(fdp.ph).catch(function(){});
      fdp.ph = null; U.fDraft = fdp; render(); break;
    case "copyweek":
      var wk2 = weekData(U.date);
      U.weekFiles = null; U.weekGrid = null;
      copyFlow(wk2.text, "week");
      if (wk2.pix.length){
        Promise.all(wk2.pix.map(function(x, i){
          return PIX.get(x.id).then(function(bl){
            return bl ? captioned(bl, x.label).then(function(c){ return new File([c], "photo-"+(i+1)+".jpg", {type:"image/jpeg"}); }) : null;
          }).catch(function(){ return null; });
        })).then(function(files){
          U.weekFiles = files.filter(Boolean); render();
        });
      }
      break;
    case "sharepix":
      var fls = U.weekFiles || [];
      if (navigator.canShare && navigator.canShare({files:fls})){
        navigator.share({files:fls}).catch(function(){});
      } else {
        U.weekGrid = fls.map(function(f){ return URL.createObjectURL(f); }); render();
      }
      break;
    case "fedit":
      U.fEdit = !U.fEdit; render(); break;
    case "fsave":
      var tk = parseInt(cardEl.querySelector('[data-f="tk"]').value, 10), tp = parseInt(cardEl.querySelector('[data-f="tp"]').value, 10);
      if (!(tk >= 800 && tk <= 6000)){ toast("Calories between 800 and 6,000."); break; }
      if (!(tp >= 0 && tp <= 400)){ toast("Protein between 0 and 400 g."); break; }
      S.diet.kcal = tk; S.diet.p = tp; U.fEdit = false; save(); render(); toast("Targets saved"); break;
    case "gobackup":
      U.view = "log"; render(); try { window.scrollTo(0,0); } catch(_){} break;
  }
});

function cssEsc(s){ return (window.CSS && CSS.escape) ? CSS.escape(s) : String(s).replace(/["\\]/g, "\\$&"); }

document.addEventListener("input", function(e){
  var t = e.target, f = t.getAttribute("data-f"), cardEl = t.closest(".ex");
  if (cardEl && (f === "w" || f === "r")){
    var n = cardEl.getAttribute("data-name");
    var d = Object.assign({}, draftFor(n)); d[f] = t.value; U.drafts[n] = d;
  } else if (f === "bw"){
    U.wDraft = t.value;
  } else if (f === "fn" || f === "fk" || f === "fp"){
    var fd1 = Object.assign({}, fDraft()); fd1[f.charAt(1)] = t.value; U.fDraft = fd1;
  } else if (cardEl && f === "t"){
    U.typed[cardEl.getAttribute("data-name")] = t.value;
  } else if (t.hasAttribute("data-sched")){
    S.schedule[t.getAttribute("data-sched")] = t.value; save();
  } else if (t.id === "restore"){
    U.restoreText = t.value;
  }
});

document.addEventListener("change", function(e){
  var t = e.target;
  if (t.id === "fphoto"){
    var pf = t.files && t.files[0]; if (!pf) return;
    toast("Adding photo…");
    shrink(pf).then(function(bl){
      var id = U.date + "-" + Date.now();
      return PIX.put(id, bl).then(function(){
        var fd2 = Object.assign({}, fDraft()); fd2.ph = id; U.fDraft = fd2; render(); toast("Photo ready. Add a few words, then Add food.");
      });
    }).catch(function(){ toast("Couldn't save that photo."); });
    return;
  }
  if (t.id === "restorefile"){
    var f = t.files && t.files[0]; if (!f) return;
    var rd = new FileReader();
    rd.onload = function(){ U.restoreText = String(rd.result || ""); U.restoreMsg = "Loaded "+f.name+". Tap Restore to add it."; render(); };
    rd.onerror = function(){ U.restoreMsg = "Couldn't read that file. Open it, copy the text, and paste it above."; render(); };
    rd.readAsText(f);
    return;
  }
  if (t.id === "date"){
    if (!/^\d{4}-\d{2}-\d{2}$/.test(t.value)) return;
    U.date = t.value; U.autoDate = (t.value === todayStr()); U.day = dayOf(U.date);
    U.drafts = {}; U.fallback = null; U.wDraft = null; U.fDraft = null; render();
  } else if (t.hasAttribute("data-def")){
    var k = t.getAttribute("data-def"), v = k === "inc" ? num(t.value) : parseInt(t.value, 10);
    var nd = Object.assign({}, S.defaults); nd[k] = k === "inc" ? r2(v) : v;
    if (nd.lo >= 1 && nd.hi >= nd.lo && nd.hi <= 100 && nd.inc > 0 && nd.inc <= 50){ S.defaults = nd; save(); toast("Saved"); }
    else { toast("Check the numbers: low reps, high reps at least as big, increase above 0."); render(); }
  }
});

document.addEventListener("keydown", function(e){
  if (e.key !== "Enter") return;
  var t = e.target;
  if (t.id === "addname"){ e.preventDefault(); addEx(t.value); }
  else if (t.getAttribute("data-f") === "t"){
    e.preventDefault();
    var btn = t.closest(".ex").querySelector('[data-act="logtyped"]'); if (btn) btn.click();
  } else if (["w","r","bw","fn","fk","fp"].indexOf(t.getAttribute("data-f")) >= 0){
    e.preventDefault(); t.blur();
  }
});

document.addEventListener("visibilitychange", function(){
  if (document.visibilityState === "visible" && U.autoDate && U.date !== todayStr()){
    U.date = todayStr(); U.day = dayOf(U.date); U.drafts = {}; render();
  }
});

load();
render();
try { prunePhotos(); } catch(e){}

if (window.claude && typeof window.claude.use === "function"){
  window.claude.use("downloads").then(function(dl){
    U.dl = dl || null;
    if (U.view === "log") render();
  }, function(){});
}
})();
</script>
<script>
if ("serviceWorker" in navigator && location.protocol === "https:") {
  window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
}
</script>
